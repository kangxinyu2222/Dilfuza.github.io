        // --- Audio Utilities for Gemini TTS ---
        const base64ToArrayBuffer = (base64) => {
            const binaryString = window.atob(base64);
            const len = binaryString.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }
            return bytes.buffer;
        };

        const writeString = (view, offset, string) => {
            for (let i = 0; i < string.length; i++) {
                view.setUint8(offset + i, string.charCodeAt(i));
            }
        };

        const createWavHeader = (length, sampleRate = 24000, numChannels = 1, bitsPerSample = 16) => {
            const buffer = new ArrayBuffer(44);
            const view = new DataView(buffer);
            writeString(view, 0, 'RIFF');
            view.setUint32(4, 36 + length, true);
            writeString(view, 8, 'WAVE');
            writeString(view, 12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true); 
            view.setUint16(22, numChannels, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * numChannels * bitsPerSample / 8, true); 
            view.setUint16(32, numChannels * bitsPerSample / 8, true); 
            view.setUint16(34, bitsPerSample, true);
            writeString(view, 36, 'data');
            view.setUint32(40, length, true);
            return buffer;
        };

        const fetchGeminiAudio = async (text, userApiKey) => {
            if (!userApiKey) return null;
            
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${userApiKey}`;
            const payload = {
                contents: [{ parts: [{ text: text }] }],
                generationConfig: {
                    responseModalities: ["AUDIO"],
                    speechConfig: {
                        voiceConfig: {
                            prebuiltVoiceConfig: { voiceName: "Kore" }
                        }
                    }
                },
                model: "gemini-2.5-flash-preview-tts"
            };

            try {
                const response = await fetch(url, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });
                
                if (!response.ok) throw new Error("TTS Request failed");
                const data = await response.json();
                const inlineData = data.candidates?.[0]?.content?.parts?.[0]?.inlineData;
                
                if (inlineData) {
                    const pcmData = base64ToArrayBuffer(inlineData.data);
                    const wavHeader = createWavHeader(pcmData.byteLength, 24000, 1, 16);
                    const wavBlob = new Blob([wavHeader, pcmData], { type: 'audio/wav' });
                    return URL.createObjectURL(wavBlob);
                }
                return null;
            } catch (e) {
                console.error("Audio generation error:", e);
                return null;
            }
        };

        // --- Main Components ---
        const SettingsModal = ({ isOpen, onClose, apiKey, setApiKey }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
                    <div className="bg-white rounded-xl shadow-2xl p-6 w-full max-w-md relative">
                        <button onClick={onClose} className="absolute top-4 right-4 text-gray-400 hover:text-gray-600">
                            <X />
                        </button>
                        <h2 className="text-xl font-bold mb-4 flex items-center gap-2">
                            <Settings className="text-blue-600" />
                            语音设置
                        </h2>
                        <div className="space-y-4">
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Google Gemini API Key</label>
                                <input 
                                    type="password" 
                                    value={apiKey}
                                    onChange={(e) => setApiKey(e.target.value)}
                                    placeholder="输入您的 API Key 以启用真人语音"
                                    className="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:outline-none"
                                />
                                <p className="text-xs text-gray-500 mt-1">
                                    * 如果不输入 Key，将使用浏览器默认的机械语音。
                                </p>
                            </div>
                            <div className="flex justify-end gap-2 mt-6">
                                <button onClick={onClose} className="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 transition">
                                    保存并关闭
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // New Component: Interactive Sentence
        // Breaks sentence into words and handles clicks
        const InteractiveSentence = ({ text, isBlur, idx, speak, lessonId }) => {
            const [selectedWord, setSelectedWord] = useState(null);
            const timeoutRef = useRef(null);
            
            // Clean simple punctuation for display
            // We keep punctuation in the span but the click target logic uses cleaned words
            const words = useMemo(() => {
                return text.split(' ').map((w, i) => ({
                    raw: w,
                    clean: w.replace(/[.,!?;:()"]/g, ''),
                    id: `${idx}-${i}`
                }));
            }, [text, idx]);

            const handleWordClick = (e, word) => {
                e.stopPropagation(); // Stop sentence playback
                const translation = getTranslation(word, lessonId);
                
                // Only show if translation exists (Strict mode for Lesson 7-18 handles this by returning null)
                if (translation) {
                    if (timeoutRef.current) clearTimeout(timeoutRef.current);
                    setSelectedWord({ word, translation, x: e.clientX, y: e.clientY });
                    
                    // Auto-hide after 1.5 seconds
                    timeoutRef.current = setTimeout(() => {
                        setSelectedWord(null);
                    }, 1500);
                }
            };

            // Close tooltip on click elsewhere
            useEffect(() => {
                const close = () => setSelectedWord(null);
                window.addEventListener('click', close);
                return () => {
                    window.removeEventListener('click', close);
                    if (timeoutRef.current) clearTimeout(timeoutRef.current);
                };
            }, []);

            return (
                <>
                    <p className={`text-lg font-medium mb-1 leading-relaxed transition-all duration-300 flex-1 ${isBlur ? 'blur-sm select-none opacity-50' : ''}`}>
                        {words.map((w, i) => {
                            const translation = getTranslation(w.clean, lessonId);
                            const isClickable = !!translation;
                            
                            return (
                                <span 
                                    key={w.id}
                                    onClick={(e) => handleWordClick(e, w.clean)}
                                    className={`inline-block mr-1 rounded px-0.5 transition-colors relative group ${isClickable ? 'cursor-pointer hover:bg-yellow-200' : 'cursor-default'}`}
                                    title={isClickable ? "点击查看翻译" : ""}
                                >
                                    {w.raw}
                                </span>
                            );
                        })}
                    </p>
                    {selectedWord && (
                        <div 
                            className="fixed z-50 bg-black text-white text-sm px-3 py-1.5 rounded shadow-lg pointer-events-none transform -translate-x-1/2 -translate-y-full mt-[-8px]"
                            style={{ left: selectedWord.x, top: selectedWord.y }}
                        >
                            <span className="font-bold text-yellow-300">{selectedWord.word}</span>: {selectedWord.translation}
                            <div className="absolute bottom-[-6px] left-1/2 transform -translate-x-1/2 w-3 h-3 bg-black rotate-45"></div>
                        </div>
                    )}
                </>
            );
        };

        const ReadingBoard = ({ currentLesson, playingIndex, setPlayingIndex, isPlaying, setIsPlaying, apiKey }) => {
            const [hoveredIndex, setHoveredIndex] = useState(null);
            const [isLoading, setIsLoading] = useState(false);
            const [isUzbekHidden, setIsUzbekHidden] = useState(false);
            const [manualVisibility, setManualVisibility] = useState({});

            const audioRef = useRef(new Audio());
            const synth = useRef(window.speechSynthesis);
            const audioCache = useRef({}); 
            const currentRequestRef = useRef(null);

            useEffect(() => {
                const audio = audioRef.current;
                setManualVisibility({});
                return () => {
                    audio.pause();
                    audio.currentTime = 0;
                    synth.current.cancel();
                    currentRequestRef.current = null;
                };
            }, [currentLesson]);

            const speakBrowser = (text, index, onEnded) => {
                synth.current.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.rate = 0.9; 
                const voices = synth.current.getVoices();
                const voice = voices.find(v => v.lang.includes('uz')) || voices.find(v => v.lang.includes('tr'));
                if (voice) utterance.voice = voice;

                utterance.onend = () => {
                    setIsPlaying(false);
                    setPlayingIndex(null);
                    if (onEnded) onEnded();
                };
                
                setPlayingIndex(index);
                setIsPlaying(true);
                setIsLoading(false);
                synth.current.speak(utterance);
            };

            const speakGemini = async (text, index, onEnded) => {
                const requestId = Date.now();
                currentRequestRef.current = requestId;
                
                if (audioCache.current[text]) {
                    playAudioUrl(audioCache.current[text], index, onEnded);
                    return;
                }

                setIsLoading(true);
                setPlayingIndex(index);

                const audioUrl = await fetchGeminiAudio(text, apiKey);
                
                if (currentRequestRef.current !== requestId) return;

                if (audioUrl) {
                    audioCache.current[text] = audioUrl;
                    playAudioUrl(audioUrl, index, onEnded);
                } else {
                    setIsLoading(false);
                    speakBrowser(text, index, onEnded);
                }
            };

            const playAudioUrl = (url, index, onEnded) => {
                const audio = audioRef.current;
                audio.src = url;
                audio.onended = () => {
                    setIsPlaying(false);
                    setPlayingIndex(null);
                    if (onEnded) onEnded();
                };
                audio.play().catch(e => console.error("Playback failed", e));
                setPlayingIndex(index);
                setIsPlaying(true);
                setIsLoading(false);
            };

            const speak = (text, index, onEnded = null) => {
                audioRef.current.pause();
                synth.current.cancel();

                if (apiKey) {
                    speakGemini(text, index, onEnded);
                } else {
                    speakBrowser(text, index, onEnded);
                }
            };

            const playAll = () => {
                if (isPlaying) {
                    audioRef.current.pause();
                    synth.current.cancel();
                    setIsPlaying(false);
                    setPlayingIndex(null);
                    currentRequestRef.current = null;
                    return;
                }

                let index = 0;
                const playNext = () => {
                    if (index >= currentLesson.content.length) {
                        setIsPlaying(false);
                        setPlayingIndex(null);
                        return;
                    }
                    const text = currentLesson.content[index].uz;
                    speak(text, index, () => {
                        index++;
                        playNext();
                    });
                };
                playNext();
            };

            const toggleSentenceVisibility = (e, index) => {
                e.stopPropagation();
                setManualVisibility(prev => {
                    const currentVal = prev[index];
                    if (currentVal === undefined) {
                        return { ...prev, [index]: isUzbekHidden }; 
                    }
                    return { ...prev, [index]: !currentVal };
                });
            };

            return (
                <div className="relative w-full max-w-4xl mx-auto bg-white rounded-xl shadow-2xl overflow-hidden border-4 border-blue-900">
                    <div className="w-full h-24 bg-blue-900 relative flex items-center justify-between px-6">
                        <div className="z-10 text-white">
                            <h2 className="text-2xl font-bold">{currentLesson.title}</h2>
                            <p className="text-blue-200 text-sm">{currentLesson.titleCn}</p>
                        </div>
                        <div className="flex gap-3 items-center">
                            <button 
                                onClick={() => {
                                    setIsUzbekHidden(!isUzbekHidden);
                                    setManualVisibility({}); 
                                }}
                                className="z-10 bg-white/20 hover:bg-white/30 text-white rounded-full p-2 transition-colors"
                                title={isUzbekHidden ? "显示所有乌兹别克语" : "隐藏所有乌兹别克语（练习模式）"}
                            >
                                {isUzbekHidden ? <Eye size={20} /> : <EyeOff size={20} />}
                            </button>
                            <button 
                                onClick={playAll}
                                disabled={isLoading && playingIndex === null}
                                className="z-10 bg-yellow-500 hover:bg-yellow-400 text-blue-900 rounded-full p-3 shadow-lg transition-transform transform hover:scale-105 disabled:opacity-50 flex items-center justify-center"
                            >
                                {isPlaying && playingIndex !== null ? <Pause fill="currentColor" /> : <Play fill="currentColor" />}
                            </button>
                        </div>
                    </div>

                    <div className="p-6 bg-slate-50 min-h-[500px] relative">
                        <div className="relative z-10 grid gap-4">
                            {currentLesson.content.map((item, idx) => {
                                const manualState = manualVisibility[idx];
                                const isHiddenByLogic = manualState !== undefined ? !manualState : isUzbekHidden;
                                const isInteracting = playingIndex === idx || hoveredIndex === idx;
                                const isBlur = isHiddenByLogic && !isInteracting;
                                const showCn = hoveredIndex === idx || playingIndex === idx || isUzbekHidden;

                                return (
                                    <div 
                                        key={idx}
                                        className={`
                                            group relative p-4 rounded-lg border-l-4 transition-all duration-300 cursor-pointer shadow-sm
                                            ${playingIndex === idx 
                                                ? 'bg-blue-100 border-blue-600 scale-[1.02] shadow-md' 
                                                : 'bg-white border-gray-300 hover:border-blue-400 hover:shadow-md'
                                            }
                                        `}
                                        onClick={() => speak(item.uz, idx)}
                                        onMouseEnter={() => setHoveredIndex(idx)}
                                        onMouseLeave={() => setHoveredIndex(null)}
                                    >
                                        <div className="flex items-start gap-4">
                                            <div className={`mt-1 p-2 rounded-full ${playingIndex === idx ? 'bg-blue-600 text-white' : 'bg-gray-100 text-gray-400 group-hover:text-blue-500'}`}>
                                                {playingIndex === idx && isLoading ? (
                                                    <Loader2 size={16} className="animate-spin" />
                                                ) : playingIndex === idx ? (
                                                    <Volume2 size={16} className="animate-pulse" />
                                                ) : (
                                                    <Volume2 size={16} />
                                                )}
                                            </div>
                                            <div className="flex-1">
                                                <div className="flex justify-between items-start">
                                                    <div className={playingIndex === idx ? 'text-blue-900' : 'text-gray-800'}>
                                                        <InteractiveSentence 
                                                            text={item.uz} 
                                                            isBlur={isBlur} 
                                                            idx={idx}
                                                            speak={speak}
                                                            lessonId={currentLesson.id}
                                                        />
                                                    </div>
                                                    <button 
                                                        onClick={(e) => toggleSentenceVisibility(e, idx)}
                                                        className="ml-2 text-gray-400 hover:text-blue-600 p-1 rounded-full hover:bg-gray-100 transition-colors flex-shrink-0"
                                                        title={isBlur ? "显示此句" : "隐藏此句"}
                                                    >
                                                        {isBlur ? <EyeOff size={16} /> : <Eye size={16} />}
                                                    </button>
                                                </div>
                                                <div className={`
                                                    overflow-hidden transition-all duration-500 ease-in-out
                                                    ${showCn ? 'max-h-20 opacity-100' : 'max-h-0 opacity-0'}
                                                `}>
                                                    <p className="text-gray-600 text-sm mt-2 border-t pt-2 border-gray-100 flex items-center gap-2">
                                                        <Globe size={12} />
                                                        {item.cn}
                                                    </p>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                    <div className="bg-gray-100 p-4 text-center text-gray-500 text-xs border-t">
                        {isUzbekHidden 
                            ? "练习模式：查看中文，回想乌兹别克语。点击单词可查看释义。" 
                            : apiKey ? "已启用真人AI语音 (Gemini) • 点击单词查看释义" : "配置 API Key 可获得更好体验 • 点击单词查看释义"}
                    </div>
                </div>
            );
        };

        const App = () => {
            const [activeLessonId, setActiveLessonId] = useState(7);
            const [isSidebarOpen, setSidebarOpen] = useState(true);
            const [playingIndex, setPlayingIndex] = useState(null);
            const [isPlaying, setIsPlaying] = useState(false);
            const [apiKey, setApiKey] = useState("");
            const [isSettingsOpen, setIsSettingsOpen] = useState(false);

            const currentLesson = lessons.find(l => l.id === activeLessonId);

            const handleLessonChange = (id) => {
                setActiveLessonId(id);
                setPlayingIndex(null);
                setIsPlaying(false);
                if (window.innerWidth < 768) setSidebarOpen(false);
            };

            return (
                <div className="min-h-screen bg-gray-200 font-sans text-gray-900 flex flex-col md:flex-row overflow-hidden relative">
                    {/* Settings Modal */}
                    <SettingsModal 
                        isOpen={isSettingsOpen} 
                        onClose={() => setIsSettingsOpen(false)}
                        apiKey={apiKey}
                        setApiKey={setApiKey}
                    />

                    {/* Sidebar */}
                    <div className={`
                        fixed md:relative z-30 h-full bg-blue-900 text-white w-64 transition-transform duration-300 ease-in-out shadow-xl flex flex-col
                        ${isSidebarOpen ? 'translate-x-0' : '-translate-x-full md:translate-x-0 md:w-20 lg:w-64'}
                    `}>
                        <div className="p-4 border-b border-blue-800 flex items-center justify-between">
                            <div className="flex items-center gap-2 font-bold text-xl lg:text-2xl overflow-hidden whitespace-nowrap">
                                <div className="p-2 bg-yellow-500 rounded text-blue-900"><BookOpen size={20}/></div>
                                <span className="md:hidden lg:block">O'zbek Tili</span>
                            </div>
                            <button onClick={() => setSidebarOpen(!isSidebarOpen)} className="md:hidden p-1 rounded hover:bg-blue-800">
                                <Menu size={20}/>
                            </button>
                        </div>

                        <div className="flex-1 overflow-y-auto py-4">
                            {lessons.map((lesson) => (
                                <button
                                    key={lesson.id}
                                    onClick={() => handleLessonChange(lesson.id)}
                                    className={`
                                        w-full text-left px-4 py-3 flex items-center gap-3 transition-colors relative
                                        ${activeLessonId === lesson.id ? 'bg-blue-800 text-yellow-400' : 'hover:bg-blue-800 text-blue-100'}
                                    `}
                                >
                                    <span className="font-mono text-sm opacity-60 w-6">{lesson.id}</span>
                                    <div className="flex-1 min-w-0 md:hidden lg:block">
                                        <p className="font-medium truncate">{lesson.title.split(':')[1]}</p>
                                        <p className="text-xs opacity-60 truncate">{lesson.titleCn.split('：')[1]}</p>
                                    </div>
                                    {activeLessonId === lesson.id && (
                                        <div className="absolute right-0 top-0 bottom-0 w-1 bg-yellow-500"></div>
                                    )}
                                </button>
                            ))}
                        </div>
                    </div>

                    {/* Main Content */}
                    <div className="flex-1 flex flex-col h-screen overflow-hidden relative">
                        {/* Header */}
                        <div className="bg-white shadow-sm p-4 flex items-center justify-between z-20">
                            <div className="flex items-center gap-4">
                                <button onClick={() => setSidebarOpen(true)} className="md:hidden text-gray-600">
                                    <Menu />
                                </button>
                                <h1 className="font-bold text-gray-800 hidden md:block">乌兹别克语阅读</h1>
                            </div>
                            <button 
                                onClick={() => setIsSettingsOpen(true)}
                                className="p-2 rounded-full hover:bg-gray-100 text-gray-600 flex items-center gap-2"
                                title="设置语音"
                            >
                                <span className="text-sm font-medium hidden sm:block">
                                    {apiKey ? "语音已就绪" : "配置语音"}
                                </span>
                                <Settings />
                            </button>
                        </div>

                        <main className="flex-1 overflow-y-auto p-4 md:p-8 relative">
                            <div className="max-w-4xl mx-auto space-y-6">
                                <div className="bg-gradient-to-r from-blue-600 to-blue-800 rounded-xl p-6 text-white shadow-lg mb-8">
                                    <h1 className="text-3xl font-bold mb-2">乌兹别克语阅读</h1>
                                    <p className="opacity-90 text-sm">
                                        交互式学习助手 | Dilfuza老师 | 小红书号：410803917
                                    </p>
                                </div>

                                <ReadingBoard 
                                    currentLesson={currentLesson} 
                                    playingIndex={playingIndex}
                                    setPlayingIndex={setPlayingIndex}
                                    isPlaying={isPlaying}
                                    setIsPlaying={setIsPlaying}
                                    apiKey={apiKey}
                                />
                            </div>
                        </main>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
